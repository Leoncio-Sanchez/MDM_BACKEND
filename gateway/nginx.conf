# ==============================================================================
# Nginx Gateway Reverse Proxy Configuration — Sistema LF-ITSE
# Entidad: Municipalidad Distrital de Morales
#
# Corte 2 (equipo), integrado en main con estas correcciones:
#   - "location /" ya no usa try_files junto con proxy_pass: Nginx buscaba los archivos en su
#     propio disco y nunca pasaba la petición al frontend (no cargaba el sistema).
#   - El límite estricto de login apunta a la ruta real: /api/auth/jwt/create/.
#   - El backend escucha en el puerto 80 del contenedor.
#
# PENDIENTE (despliegue): los nombres de los upstream (laravel.test, frontend) deben coincidir
# con los servicios del docker-compose de PRODUCCIÓN, que aún no existe en el repositorio.
# Reemplazar también server_name por el subdominio oficial que asigne la municipalidad.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Optimización de Conexiones
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting (Protección contra DDoS y fuerza bruta)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Upstreams
    upstream backend_api {
        server laravel.test:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 1. Redirección HTTP (Puerto 80) hacia HTTPS Seguro (Puerto 443)
    server {
        listen 80;
        listen [::]:80;
        server_name lf-itse.morales.gob.pe localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Servidor Seguro HTTPS (Puerto 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name lf-itse.morales.gob.pe localhost;

        # Certificados SSL / TLS
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Cabeceras de Seguridad Corporativa
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

        client_max_body_size 20M;

        # Enrutamiento Backend API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Enrutamiento específico para autenticación (Rate Limit estricto)
        location = /api/auth/jwt/create/ {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Enrutamiento Frontend SPA (Vue 3)
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # El modo historial de Vue (rutas como /admin/itse) lo resuelve el contenedor del
            # frontend devolviendo index.html; aquí no va try_files (rompería el proxy).
        }
    }
}
