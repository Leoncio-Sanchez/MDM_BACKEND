# Nginx dentro del contenedor del backend: sirve public/ y pasa lo demás a PHP-FPM.
# TLS, certificados y dominio los resuelve nginx-proxy, delante de este contenedor.
worker_processes 2;
pid /tmp/nginx.pid;
# "warn" avisaría en cada subida o descarga grande que pasa por un archivo temporal
error_log /dev/stderr error;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rutas escribibles sin root
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # $http_x_forwarded_for: la IP real del cliente; $remote_addr aquí siempre es nginx-proxy
    log_format principal '$http_x_forwarded_for [$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout principal;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Mismo total que post_max_size de php.ini
    client_max_body_size 110m;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # El único PHP que se ejecuta es el punto de entrada de Laravel
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 90s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            return 404;
        }
    }
}
