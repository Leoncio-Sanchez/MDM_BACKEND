; PHP-FPM de producción — Sistema LF-ITSE
[global]
daemonize = no

[www]
; Solo dentro del contenedor. El valor de la imagen oficial (9000 en todas las interfaces)
; dejaría FastCGI al alcance de cualquier contenedor de la red compartida "web".
listen = 127.0.0.1:9000

; Ajustado al límite de 1 GB de compose.prod.yaml (OPcache 128 MB + unos 60 MB por worker)
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 90s

clear_env = no
; El acceso ya lo registra Nginx
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
