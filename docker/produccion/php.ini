; PHP de producción — Sistema LF-ITSE
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 256M
max_execution_time = 60

; Un adjunto pesa hasta 10 MB (PoliticaArchivos) y un acta lleva hasta 10 fotos en un solo pedido
; (RegistrarActaRequest). nginx.conf y nginx-proxy deben aceptar el mismo total: 110 MB.
upload_max_filesize = 10M
post_max_size = 110M
max_file_uploads = 20

; El código no cambia dentro del contenedor: cada versión es una imagen nueva
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
